<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rclone Manager</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 2.5rem auto;
        max-width: 40rem;
        line-height: 1.5;
      }
      code {
        font-size: 0.95em;
      }
    </style>
  </head>
  <body>
    <h1>Rclone Manager</h1>
    <p>
      The desktop UI is the <strong>GTK 4 + libadwaita</strong> client in
      <code>gtk-app</code>.
    </p>
    <p>
      This process is the Rust backend. On Linux, run
      <code>rclone-manager-gtk</code>. Headless builds expose
      <code>/health</code> and the <code>/api</code> routes from this server.
    </p>
  </body>

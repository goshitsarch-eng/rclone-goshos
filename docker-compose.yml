# =============================================================================
# RClone Manager — Docker Compose
# =============================================================================
# Quick start:
#   1. Set RCLONE_MANAGER_USER / RCLONE_MANAGER_PASS below to your own values.
#   2. docker compose up -d
#   3. Open http://localhost:8080
#
# The API (command bridge, file streaming, uploads) is reachable by anyone who
# can reach the published port, so the server refuses to bind a non-loopback
# address without credentials. Publish to loopback only, or pass
# RCLONE_MANAGER_INSECURE_NO_AUTH=true, if you deliberately want it open.
#
# For advanced configuration (TLS, host networking):
#   https://hakanismail.info/zarestia/rclone-manager/docs/configuration-headless
# =============================================================================

services:
  rclone-manager:
    image: ghcr.io/zarestia-dev/rclone-manager:latest
    container_name: rclone-manager
    restart: unless-stopped

    ports:
      # Publishes to every interface. Use '127.0.0.1:8080:8080' to keep it on
      # this host only.
      - '8080:8080'
      # Uncomment below if you need OAuth authentication for cloud remotes
      # (Google Drive, OneDrive, Dropbox, etc.)
      # Alternatively, use 'network_mode: host' — see docs for details.
      # - "53682:53682"

    volumes:
      - rclone-data:/data # App data & rclone binary (auto-downloaded on first run)
      - rclone-config:/config # rclone.conf

    environment:
      # Match these to your host user to avoid permission issues on mounted volumes.
      # Run 'id' in your terminal to find your UID/GID.
      - PUID=1000
      - PGID=1000
      # - PGIDS=1000,3000 # Optional: Supplementary group IDs (comma-separated) for NFSv4 ACLs / ZFS mounts

      # --- Optional: Master Secret / rcman Encrypted Credentials ---
      # Master password for rcman encrypted credentials store (remote passwords, tokens).
      # - RCLONE_MANAGER_SECRET=MySuperSecretPassword123!
      # - RCLONE_MANAGER_SECRET_PATH=/data/.secret # Path to secret file (must exist before starting container)

      # --- Required: Basic Authentication ---
      # Change these before the first start. Without them the server refuses to
      # bind 0.0.0.0, because the API would otherwise be open to the network —
      # including the command bridge, file streaming and uploads.
      - RCLONE_MANAGER_USER=admin
      - RCLONE_MANAGER_PASS=change-me-before-first-start
      #
      # Terminating auth at a reverse proxy instead? Publish to loopback
      # ('127.0.0.1:8080:8080' above) and let the proxy do it, or opt out
      # explicitly:
      # - RCLONE_MANAGER_INSECURE_NO_AUTH=true

      # --- Optional: HTTPS/TLS ---
      # Mount your certs and uncomment these to enable HTTPS directly.
      # - RCLONE_MANAGER_TLS_CERT=/app/certs/cert.pem
      # - RCLONE_MANAGER_TLS_KEY=/app/certs/key.pem

    # --- Optional: TLS cert volume ---
    # Uncomment if using the TLS options above.
    # volumes:
    #   - ./certs:/app/certs:ro

    # --- Optional: Host networking ---
    # Uncomment to fix OAuth browser authentication (Google Drive, OneDrive, etc.)
    # When enabled, remove the 'ports' section above — it's not needed.
    # network_mode: host

    healthcheck:
      # /health sits outside the auth layer, so no credentials are needed here.
      test: ['CMD', 'curl', '-sf', 'http://localhost:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  rclone-data:
    name: rclone-manager-data
  rclone-config:
    name: rclone-manager-config
